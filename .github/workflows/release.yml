name: Release (Docker Hub)

# Se dispara al crear un tag de versión:  git tag v0.1.0 && git push --tags
on:
  push:
    tags: ["v*"]

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Versión (sin la "v")
        id: ver
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.app }}.Dockerfile
          push: true
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fmc-${{ matrix.app }}:${{ steps.ver.outputs.value }}
            ${{ secrets.DOCKERHUB_USERNAME }}/fmc-${{ matrix.app }}:latest
