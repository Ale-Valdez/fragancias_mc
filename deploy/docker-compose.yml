# Stack de despliegue (pruebas y producción). Se copia al servidor junto con su .env.
# Ningún servicio publica puertos: todo el tráfico entra por el túnel de Cloudflare.
name: ${COMPOSE_PROJECT_NAME:-fmc}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?falta CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  web:
    image: ${REGISTRY_NS:?falta REGISTRY_NS}/fmc-web:${IMAGE_TAG:?falta IMAGE_TAG}
    environment:
      # La web llama a la API por la red interna. El nombre del servicio es siempre "api".
      API_INTERNAL_URL: http://api:4000
      SITE_URL: ${SITE_URL:?falta SITE_URL}
      ALLOW_INDEXING: ${ALLOW_INDEXING:-false}
      WHATSAPP_PHONE: ${WHATSAPP_PHONE:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging

  api:
    image: ${REGISTRY_NS}/fmc-api:${IMAGE_TAG}
    environment:
      NODE_ENV: production
      PORT: "4000"
      SITE_URL: ${SITE_URL:?falta SITE_URL}
      ALLOW_INDEXING: ${ALLOW_INDEXING:-false}
      SESSION_SECRET: ${SESSION_SECRET:?falta SESSION_SECRET}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?falta S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?falta S3_SECRET_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA:-media}
      S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE:-private}
      PRINT_BASE_URL: http://web:3000
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 1536m
    shm_size: 512m # Chromium usa /dev/shm para generar PDFs
    logging: *default-logging

  # Tarea puntual: docker compose --profile tools run --rm migrate
  migrate:
    image: ${REGISTRY_NS}/fmc-api:${IMAGE_TAG}
    command: ["node", "dist/db/migrate.js"]
    environment:
      NODE_ENV: production
      SITE_URL: ${SITE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  # Tarea puntual:
  # docker compose --profile tools run --rm -e ADMIN_EMAIL=... -e ADMIN_PASSWORD=... create-admin
  create-admin:
    image: ${REGISTRY_NS}/fmc-api:${IMAGE_TAG}
    command: ["node", "dist/scripts/create-admin.js"]
    environment:
      NODE_ENV: production
      SITE_URL: ${SITE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  db:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?falta POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 1g
    logging: *default-logging

  # Servidor de objetos compatible con S3 (reemplazo de MinIO, ver guía).
  storage:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging

volumes:
  db-data:
  storage-data: